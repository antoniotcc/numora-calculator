name: numora
description: "Una calculadora simple, bonita y rápida."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  math_expressions: ^2.4.0
  google_fonts: ^6.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher: ^6.2.5
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  image_path: "lib/assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
  - lib/assets/images/avatar.jpg
